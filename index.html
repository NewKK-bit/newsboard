<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>32:9 Google News Board</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap');
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000c24; color: white; font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }
        .header { height: 15%; display: flex; justify-content: space-between; align-items: center; padding: 0 4%; border-bottom: 2px solid #1a3a6d; }
        .welcome-text { font-size: 2.5vw; font-weight: 900; }
        .clock { font-size: 2vw; color: #cbd5e1; }
        .main-content { height: 65%; display: flex; align-items: center; padding: 0 6%; }
        .news-box { display: flex; align-items: center; gap: 3vw; animation: fadeIn 0.8s ease-out; }
        .category-tag { background-color: #1a73e8; padding: 10px 30px; border-radius: 12px; font-size: 2vw; font-weight: 700; min-width: 10vw; text-align: center; }
        .news-title { font-size: 3.5vw; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65vw; }
        .footer-weather { height: 20%; background-color: #00153d; display: flex; align-items: center; padding: 0 5%; gap: 4vw; border-top: 1px solid #334155; }
        .weather-info { display: flex; align-items: center; gap: 2vw; font-size: 2vw; }
        .temp { font-size: 2.5vw; font-weight: 700; color: #fbbf24; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="welcome-text">WELCOME <span style="font-size: 1.2vw; font-weight: 400; margin-left: 1vw;">구글 실시간 뉴스 브리핑</span></div>
        <div id="clock" class="clock">로딩 중...</div>
    </div>
    <div class="main-content">
        <div id="news-display" class="news-box">
            <div id="category" class="category-tag">뉴스</div>
            <div id="title" class="news-title">실시간 뉴스를 초고속으로 연결 중입니다...</div>
        </div>
    </div>
    <div class="footer-weather">
        <div style="font-size: 1.5vw; color: #94a3b8; font-weight: 700;">오늘의 날씨</div>
        <div class="weather-info">
            <span id="temp" class="temp">23°C</span>
            <span id="humidity">습도 45%</span>
            <span id="condition">맑음</span>
        </div>
    </div>
</div>

<script>
    // 구글 뉴스 RSS 카테고리별 주소 (대한민국 지역 설정)
    const googleNewsFeeds = {
        "정치": "https://news.google.com/rss/headlines/section/topic/POLITICS?hl=ko&gl=KR&ceid=KR:ko",
        "경제": "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko",
        "사회": "https://news.google.com/rss/headlines/section/topic/SOCIETY?hl=ko&gl=KR&ceid=KR:ko",
        "국제": "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko",
        "IT/과학": "https://news.google.com/rss/headlines/section/topic/SCITECH?hl=ko&gl=KR&ceid=KR:ko"
    };

    let allNews = [{ cat: "로딩", title: "구글 뉴스에서 최신 정보를 가져오고 있습니다." }];
    let displayIndex = 0;

    async function fetchGoogleNews() {
        let combined = [];
        // rss2json 서비스의 다른 서버 경로를 사용하여 우회 (더 빠름)
        const proxyBase = "https://api.rss2json.com/v1/api.json?rss_url=";

        for (const [cat, rssUrl] of Object.entries(googleNewsFeeds)) {
            try {
                const response = await fetch(`${proxyBase}${encodeURIComponent(rssUrl)}`);
                const data = await response.json();
                
                if (data.status === 'ok') {
                    const top3 = data.items.slice(0, 3).map(item => ({
                        cat: cat,
                        title: item.title.split(' - ')[0] // 구글 뉴스는 제목 뒤에 언론사명이 붙으므로 깔끔하게 잘라냄
                    }));
                    combined = combined.concat(top3);
                }
            } catch (e) { console.error(cat + " 뉴스 실패"); }
        }

        if (combined.length > 0) {
            allNews = combined;
            rotateNews(); // 뉴스 로드 즉시 화면 교체
        }
    }

    function rotateNews() {
        if (allNews.length === 0) return;
        const displayEl = document.getElementById('news-display');
        displayEl.style.animation = 'none';
        displayEl.offsetHeight; 
        displayEl.style.animation = 'fadeIn 0.8s ease-out';
        
        const item = allNews[displayIndex];
        document.getElementById('category').innerText = item.cat;
        document.getElementById('title').innerText = item.title;
        displayIndex = (displayIndex + 1) % allNews.length;
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString('ko-KR', { 
            year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', 
            hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true 
        });
    }

    // 초기 실행
    updateClock();
    setInterval(updateClock, 1000);
    
    // 즉시 뉴스 수집 시작
    fetchGoogleNews();
    
    setInterval(rotateNews, 60000); // 1분마다 뉴스 교체
    setInterval(fetchGoogleNews, 600000); // 10분마다 데이터 갱신
</script>
</body>
</html>
