<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32:9 기업 웰컴 보드 - 화이트 테마</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* 화이트 테마 전용 색상 설정 */
            --bg-main: #f8f9fa;      /* 전체 배경: 아주 연한 회색 */
            --bg-panel: #ffffff;    /* 뉴스 행 배경: 순백색 */
            --bg-footer: #e9ecef;   /* 하단 바 배경: 연한 회색 */
            --text-title: #1a1a1a;  /* 주요 제목: 진한 검정 */
            --text-body: #333333;   /* 본문 텍스트 */
            --text-sub: #6c757d;    /* 부가 정보: 회색 */
            --accent-blue: #0056b3; /* 포인트 블루 */
            --border-color: #dee2e6; /* 경계선 색상 */
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-main);
            color: var(--text-body);
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* 헤더 영역 */
        .header {
            height: 18%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 4%; border-bottom: 2px solid var(--border-color);
            background-color: #ffffff;
        }
        .header-left .tag-line { border-left: 5px solid var(--accent-blue); padding-left: 15px; }
        .header-left .tag-title { font-size: 1.8vw; font-weight: 900; color: var(--text-title); display: block; }
        .header-left .tag-sub { font-size: 1.1vw; color: var(--text-sub); }

        .header-center { text-align: center; position: absolute; left: 50%; transform: translateX(-50%); }
        .header-center h1 { font-size: 4.5vw; font-weight: 900; color: var(--text-title); margin: 0; letter-spacing: 1px; }
        .header-center p { font-size: 1.3vw; color: var(--text-sub); margin: 0; font-weight: 500; }

        .header-right { text-align: right; }
        .header-right .date { font-size: 1.3vw; color: var(--text-sub); }
        .header-right .time { font-size: 3.5vw; font-weight: 900; color: var(--accent-blue); line-height: 1; }

        /* 뉴스 보드 영역 */
        .news-board { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            padding: 2.5% 4%; 
            margin-top: 1vh;
            gap: 1.8vh; 
        }
        .news-row {
            display: grid; grid-template-columns: 10vw 2px 1fr; align-items: center;
            background-color: var(--bg-panel); border-radius: 8px; height: 12.5%;
            border: 1px solid var(--border-color); padding: 0 30px;
            /* 밝은 배경에서 입체감을 위한 그림자 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        
        .cat-box { font-size: 1.8vw; font-weight: 900; text-align: center; }
        .divider { background-color: var(--border-color); height: 40%; width: 2px; margin: 0 30px; }

        /* 화이트 테마에 어울리는 카테고리 색상 */
        .cat-pol { color: #004085; } 
        .cat-eco { color: #155724; } 
        .cat-spo { color: #721c24; } 
        .cat-hea { color: #856404; } 
        .cat-int { color: #383d41; } 
        .cat-sci { color: #005a6b; }

        .news-title-cell { height: 100%; display: flex; align-items: center; overflow: hidden; width: 100%; position: relative; }
        .title-text { 
            font-size: 2.3vw; font-weight: 700; color: #000000;
            white-space: nowrap; display: inline-block; transform-origin: left center; 
        }

        /* 하단 날씨 및 로고 바 */
        .footer-bar {
            height: 18%; background-color: var(--bg-footer); display: flex;
            align-items: center; padding: 0 4%; border-top: 2px solid var(--border-color);
            justify-content: space-between;
        }
        .weather-area { display: flex; align-items: center; gap: 45px; }
        .weather-label { font-size: 1.6vw; font-weight: 900; color: var(--text-title); }
        .weather-main { display: flex; align-items: center; gap: 15px; }
        .weather-temp { font-size: 3.2vw; font-weight: 900; color: #d9480f; } /* 날씨 온도 강조 */
        .weather-details { display: flex; gap: 35px; font-size: 1.4vw; color: var(--text-body); font-weight: 500; }
        .weather-details i { color: var(--accent-blue); }
        
        /* 로고 영역 */
        .logo-area { display: flex; align-items: center; }
        .logo-area img {
            height: 9vh; 
            width: auto;
            object-fit: contain;
        }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-left">
            <div class="tag-line">
                <span class="tag-title">간추린 뉴스</span>
                <span class="tag-sub">실시간 뉴스 브리핑</span>
            </div>
        </div>
        <div class="header-center">
            <h1>WELCOME</h1>
            <p>광동제약을 방문해 주셔서 감사합니다</p>
        </div>
        <div class="header-right">
            <div id="display-date" class="date">----.--.-- (-)</div>
            <div id="display-time" class="time">00:00:00 AM</div>
        </div>
    </header>

    <main class="news-board">
        <div class="news-row" id="row-politics"><div class="cat-box cat-pol">정치</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-economy"><div class="cat-box cat-eco">경제</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-sports"><div class="cat-box cat-spo">스포츠</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-health"><div class="cat-box cat-hea">건강</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-international"><div class="cat-box cat-int">국제</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-science"><div class="cat-box cat-sci">IT/과학</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
    </main>

    <footer class="footer-bar">
        <div class="weather-area">
            <div class="weather-label">오늘의 날씨</div>
            <div class="weather-main">
                <i id="w-icon" class="fa-solid fa-sun" style="font-size:3.5vw; color:#f08c00;"></i>
                <div id="w-temp" class="weather-temp">--°C</div>
            </div>
            <div class="weather-details">
                <span id="w-location">과천시</span>
                <span><i class="fa-solid fa-droplet"></i> 습도 <span id="w-humi">--</span>%</span>
                <span><i class="fa-solid fa-wind"></i> 풍속 <span id="w-wind">--</span>km/h</span>
                <span><i class="fa-solid fa-leaf"></i> 미세먼지 <span style="color:#2b8a3e; font-weight: 700;">좋음</span></span>
            </div>
        </div>
        <div class="logo-area">
            <img src="https://github.com/NewKK-bit/newsboard/blob/main/logo.png?raw=true" alt="광동제약 로고">
        </div>
    </footer>
</div>

<script>
    const feeds = {
        politics: "https://news.google.com/rss/headlines/section/topic/POLITICS?hl=ko&gl=KR&ceid=KR:ko",
        economy: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko",
        sports: "https://news.google.com/rss/headlines/section/topic/SPORTS?hl=ko&gl=KR&ceid=KR:ko",
        health: "https://news.google.com/rss/headlines/section/topic/HEALTH?hl=ko&gl=KR&ceid=KR:ko",
        international: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko",
        science: "https://news.google.com/rss/headlines/section/topic/SCITECH?hl=ko&gl=KR&ceid=KR:ko"
    };

    let newsData = { politics: [], economy: [], sports: [], health: [], international: [], science: [] };
    let currentRank = 0;

    function adjustFontSize() {
        const cells = document.querySelectorAll('.news-title-cell');
        cells.forEach(cell => {
            const text = cell.querySelector('.title-text');
            const containerWidth = cell.offsetWidth - 20; 
            text.style.fontSize = "2.3vw"; 
            const textWidth = text.scrollWidth;
            if (textWidth > containerWidth) {
                let scaleFactor = containerWidth / textWidth;
                let newSize = 2.3 * scaleFactor;
                text.style.fontSize = newSize + "vw";
            }
        });
    }

    async function fetchAllNews() {
        const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
        for (const [key, url] of Object.entries(feeds)) {
            try {
                const response = await fetch(proxy + encodeURIComponent(url) + "&t=" + Date.now());
                const data = await response.json();
                if (data.status === 'ok') { newsData[key] = data.items.slice(0, 3); }
            } catch (e) {}
        }
        displayNews();
    }

    function displayNews() {
        Object.keys(newsData).forEach(key => {
            const items = newsData[key];
            if (items.length > currentRank) {
                const row = document.getElementById(`row-${key}`);
                const textEl = row.querySelector('.title-text');
                textEl.innerText = items[currentRank].title.split(' - ')[0];
                textEl.classList.remove('fade-in');
                void textEl.offsetWidth; 
                textEl.classList.add('fade-in');
            }
        });
        setTimeout(adjustFontSize, 100);
        currentRank = (currentRank + 1) % 3;
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('display-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        document.getElementById('display-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }

    async function updateWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4292&longitude=126.9899&current_weather=true&relative_humidity_2m=true');
            const data = await res.json();
            document.getElementById('w-temp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            document.getElementById('w-humi').innerText = data.current_weather.relative_humidity_2m || 45;
            document.getElementById('w-wind').innerText = data.current_weather.windspeed;
        } catch (e) {}
    }

    fetchAllNews();
    setInterval(displayNews, 15000); 
    setInterval(fetchAllNews, 600000);
    updateClock(); setInterval(updateClock, 1000);
    updateWeather(); setInterval(updateWeather, 3600000);
    window.addEventListener('resize', adjustFontSize);
</script>
</body>
</html>
