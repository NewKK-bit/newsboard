<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32:9 기업 웰컴 보드 - 뉴스 & 과천 날씨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020817;
            --bg-panel: rgba(15, 23, 42, 0.8);
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* 헤더 영역 */
        .header {
            height: 18%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 4%; border-bottom: 2px solid var(--border-color);
        }
        .header-left .tag-line { border-left: 4px solid var(--accent-blue); padding-left: 15px; }
        .header-left .tag-title { font-size: 1.8vw; font-weight: 700; display: block; }
        .header-left .tag-sub { font-size: 1.1vw; color: var(--text-sub); }

        .header-center { text-align: center; position: absolute; left: 50%; transform: translateX(-50%); }
        .header-center h1 { font-size: 4.5vw; font-weight: 900; margin: 0; letter-spacing: 2px; }
        .header-center p { font-size: 1.3vw; color: var(--text-sub); margin: 0; }

        .header-right { text-align: right; }
        .header-right .date { font-size: 1.3vw; color: var(--text-sub); }
        .header-right .time { font-size: 3.5vw; font-weight: 700; line-height: 1; }

        /* 뉴스 보드 */
        .news-board { flex-grow: 1; display: flex; flex-direction: column; padding: 1.5% 4%; gap: 1.2vh; }
        .news-row {
            display: grid; 
            grid-template-columns: 10vw 2px 1fr; 
            align-items: center;
            background-color: var(--bg-panel); border-radius: 4px; height: 16%;
            border: 1px solid var(--border-color); padding: 0 30px;
        }
        
        .cat-box { font-size: 1.8vw; font-weight: 800; text-align: center; letter-spacing: 1px; }
        .divider { background-color: var(--border-color); height: 50%; width: 2px; margin: 0 30px; }

        .cat-pol { color: #60a5fa; } 
        .cat-eco { color: #34d399; } 
        .cat-cul { color: #f472b6; } 
        .cat-int { color: #a78bfa; } 
        .cat-sci { color: #22d3ee; }

        .news-title-cell { 
            font-size: 2.3vw; font-weight: 500; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            padding-right: 20px; 
        }

        /* 하단 날씨 바 */
        .footer-bar {
            height: 18%; background-color: rgba(2, 6, 23, 0.9); display: flex;
            align-items: center; padding: 0 4%; gap: 40px; border-top: 1px solid var(--border-color);
        }
        .weather-label { font-size: 1.6vw; font-weight: 700; white-space: nowrap; }
        .weather-main { display: flex; align-items: center; gap: 15px; }
        .weather-main i { font-size: 3.5vw; color: #fbbf24; }
        .weather-temp { font-size: 3.2vw; font-weight: 700; color: #fbbf24; }
        .weather-details { display: flex; gap: 35px; font-size: 1.4vw; color: var(--text-sub); flex-grow: 1; }
        .weather-details span { display: flex; align-items: center; gap: 8px; }
        .weather-details i { color: #60a5fa; font-size: 1.4vw; }
        .dust-good { color: #4ade80; font-weight: 700; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-left">
            <div class="tag-line">
                <span class="tag-title">간추린 뉴스</span>
                <span class="tag-sub">오늘의 뉴스 브리핑</span>
            </div>
        </div>
        <div class="header-center">
            <h1>WELCOME</h1>
            <p>광동제약을 방문해 주셔서 감사합니다</p>
        </div>
        <div class="header-right">
            <div id="display-date" class="date">----.--.-- (-)</div>
            <div id="display-time" class="time">00:00 AM</div>
        </div>
    </header>

    <main class="news-board">
        <div class="news-row" id="row-politics">
            <div class="cat-box cat-pol">정치</div><div class="divider"></div>
            <div class="news-title-cell title">뉴스 연결 중...</div>
        </div>
        <div class="news-row" id="row-economy">
            <div class="cat-box cat-eco">경제</div><div class="divider"></div>
            <div class="news-title-cell title">뉴스 연결 중...</div>
        </div>
        <div class="news-row" id="row-culture">
            <div class="cat-box cat-cul">문화</div><div class="divider"></div>
            <div class="news-title-cell title">뉴스 연결 중...</div>
        </div>
        <div class="news-row" id="row-international">
            <div class="cat-box cat-int">국제</div><div class="divider"></div>
            <div class="news-title-cell title">뉴스 연결 중...</div>
        </div>
        <div class="news-row" id="row-science">
            <div class="cat-box cat-sci">IT/과학</div><div class="divider"></div>
            <div class="news-title-cell title">뉴스 연결 중...</div>
        </div>
    </main>

    <footer class="footer-bar">
        <div class="weather-label">오늘의 날씨</div>
        <div class="weather-main"><i id="w-icon" class="fa-solid fa-sun"></i><div id="w-temp" class="weather-temp">--°C</div></div>
        <div class="weather-details">
            <span id="w-location">과천시</span>
            <span><i class="fa-solid fa-droplet"></i> 습도 <span id="w-humi">--</span>%</span>
            <span><i class="fa-solid fa-wind"></i> 풍속 <span id="w-wind">--</span>km/h</span>
            <span><i class="fa-solid fa-leaf"></i> 미세먼지 <span id="w-dust" class="dust-good">좋음 (12)</span></span>
        </div>
    </footer>
</div>

<script>
    const feeds = {
        politics: "https://news.google.com/rss/headlines/section/topic/POLITICS?hl=ko&gl=KR&ceid=KR:ko",
        economy: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko",
        culture: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko",
        international: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko",
        science: "https://news.google.com/rss/headlines/section/topic/SCITECH?hl=ko&gl=KR&ceid=KR:ko"
    };

    const rowMapping = { 
        politics: "row-politics", economy: "row-economy", culture: "row-culture", 
        international: "row-international", science: "row-science" 
    };

    async function fetchNews() {
        const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
        const requests = Object.entries(feeds).map(async ([key, url]) => {
            try {
                const response = await fetch(proxy + encodeURIComponent(url) + "&t=" + Date.now());
                const data = await response.json();
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    const latest = data.items[0];
                    const row = document.getElementById(rowMapping[key]);
                    const titleEl = row.querySelector('.title');
                    titleEl.innerText = latest.title.split(' - ')[0];
                }
            } catch (e) { console.error(key + " 로드 실패", e); }
        });
        await Promise.all(requests);
    }

    async function updateWeather() {
        try {
            // 과천시 좌표 적용: latitude=37.4292, longitude=126.9899
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4292&longitude=126.9899&current_weather=true&relative_humidity_2m=true');
            const data = await res.json();
            const curr = data.current_weather;
            
            document.getElementById('w-temp').innerText = `${Math.round(curr.temperature)}°C`;
            document.getElementById('w-wind').innerText = curr.windspeed;
            document.getElementById('w-humi').innerText = data.current_weather.relative_humidity || 45;
            
            const code = curr.weathercode;
            let icon = "fa-sun";
            if (code >= 1 && code <= 3) icon = "fa-cloud-sun";
            else if (code >= 45) icon = "fa-smog";
            else if (code >= 51) icon = "fa-cloud-showers-heavy";
            document.getElementById('w-icon').className = `fa-solid ${icon}`;
        } catch (e) { console.error("날씨 로드 실패", e); }
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('display-date').innerText = 
            now.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        document.getElementById('display-time').innerText = 
            now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
    }

    updateClock(); setInterval(updateClock, 1000);
    fetchNews(); setInterval(fetchNews, 600000);
    updateWeather(); setInterval(updateWeather, 3600000);
</script>
</body>
</html>
