<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32:9 기업 웰컴 보드 - 뉴스 순환 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #020817;
            --bg-panel: rgba(15, 23, 42, 0.8);
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            overflow: hidden;
        }

        .container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* 헤더 */
        .header {
            height: 18%; display: flex; justify-content: space-between; align-items: center;
            padding: 0 4%; border-bottom: 2px solid var(--border-color);
        }
        .header-left .tag-line { border-left: 4px solid var(--accent-blue); padding-left: 15px; }
        .header-left .tag-title { font-size: 1.8vw; font-weight: 700; display: block; }
        .header-left .tag-sub { font-size: 1.1vw; color: var(--text-sub); font-weight: 400; }

        .header-center { text-align: center; position: absolute; left: 50%; transform: translateX(-50%); }
        .header-center h1 { font-size: 4.5vw; font-weight: 900; margin: 0; letter-spacing: 2px; }
        .header-center p { font-size: 1.3vw; color: var(--text-sub); margin: 0; }

        .header-right { text-align: right; }
        .header-right .date { font-size: 1.3vw; color: var(--text-sub); }
        .header-right .time { font-size: 3.5vw; font-weight: 700; line-height: 1; }

        /* 뉴스 보드 */
        .news-board { flex-grow: 1; display: flex; flex-direction: column; padding: 1.5% 4%; gap: 1.2vh; }
        .news-row {
            display: grid; 
            grid-template-columns: 10vw 2px 1fr; 
            align-items: center;
            background-color: var(--bg-panel); border-radius: 4px; height: 16%;
            border: 1px solid var(--border-color); padding: 0 30px;
        }
        
        .cat-box { font-size: 1.8vw; font-weight: 800; text-align: center; }
        .divider { background-color: var(--border-color); height: 50%; width: 2px; margin: 0 30px; }

        .cat-pol { color: #60a5fa; } .cat-eco { color: #34d399; } 
        .cat-cul { color: #f472b6; } .cat-int { color: #a78bfa; } .cat-sci { color: #22d3ee; }

        /* 제목 영역 */
        .news-title-cell { 
            height: 100%; display: flex; align-items: center; overflow: hidden; width: 100%;
            position: relative;
        }
        .title-text {
            font-size: 2.3vw; font-weight: 500; 
            white-space: nowrap; 
            display: inline-block;
            transform-origin: left center;
        }

        /* 하단 날씨 바 */
        .footer-bar {
            height: 18%; background-color: rgba(2, 6, 23, 0.9); display: flex;
            align-items: center; padding: 0 4%; gap: 40px; border-top: 1px solid var(--border-color);
        }
        .weather-label { font-size: 1.6vw; font-weight: 700; }
        .weather-main { display: flex; align-items: center; gap: 15px; }
        .weather-temp { font-size: 3.2vw; font-weight: 700; color: #fbbf24; }
        .weather-details { display: flex; gap: 35px; font-size: 1.4vw; color: var(--text-sub); flex-grow: 1; }
        
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <div class="header-left">
            <div class="tag-line">
                <span class="tag-title">간추린 뉴스</span>
                <span class="tag-sub">오늘의 뉴스 브리핑</span>
            </div>
        </div>
        <div class="header-center">
            <h1>WELCOME</h1>
            <p>우리 회사를 방문해 주셔서 감사합니다</p>
        </div>
        <div class="header-right">
            <div id="display-date" class="date">----.--.-- (-)</div>
            <div id="display-time" class="time">00:00 AM</div>
        </div>
    </header>

    <main class="news-board">
        <div class="news-row" id="row-politics"><div class="cat-box cat-pol">정치</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-economy"><div class="cat-box cat-eco">경제</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-culture"><div class="cat-box cat-cul">문화</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-international"><div class="cat-box cat-int">국제</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
        <div class="news-row" id="row-science"><div class="cat-box cat-sci">IT/과학</div><div class="divider"></div><div class="news-title-cell"><div class="title-text">데이터 로딩 중...</div></div></div>
    </main>

    <footer class="footer-bar">
        <div class="weather-label">오늘의 날씨</div>
        <div class="weather-main"><i id="w-icon" class="fa-solid fa-sun" style="font-size:3.5vw; color:#fbbf24;"></i><div id="w-temp" class="weather-temp">--°C</div></div>
        <div class="weather-details">
            <span id="w-location">과천시</span>
            <span><i class="fa-solid fa-droplet"></i> 습도 <span id="w-humi">--</span>%</span>
            <span><i class="fa-solid fa-wind"></i> 풍속 <span id="w-wind">--</span>km/h</span>
            <span><i class="fa-solid fa-leaf"></i> 미세먼지 <span id="w-dust" style="color:#4ade80;">좋음</span></span>
        </div>
    </footer>
</div>

<script>
    const feeds = {
        politics: "https://news.google.com/rss/headlines/section/topic/POLITICS?hl=ko&gl=KR&ceid=KR:ko",
        economy: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=ko&gl=KR&ceid=KR:ko",
        culture: "https://news.google.com/rss/headlines/section/topic/ENTERTAINMENT?hl=ko&gl=KR&ceid=KR:ko",
        international: "https://news.google.com/rss/headlines/section/topic/WORLD?hl=ko&gl=KR&ceid=KR:ko",
        science: "https://news.google.com/rss/headlines/section/topic/SCITECH?hl=ko&gl=KR&ceid=KR:ko"
    };

    let newsData = { politics: [], economy: [], culture: [], international: [], science: [] };
    let currentRank = 0;

    // 개선된 폰트 조절 로직: 텍스트 폭을 박스 폭에 1:1로 맞춤
    function adjustFontSize() {
        const cells = document.querySelectorAll('.news-title-cell');
        cells.forEach(cell => {
            const text = cell.querySelector('.title-text');
            const containerWidth = cell.offsetWidth - 20; // 박스 실제 가용 폭
            
            // 폰트 크기를 초기화하고 실제 텍스트 길이를 측정
            text.style.fontSize = "2.3vw"; 
            const textWidth = text.scrollWidth;

            if (textWidth > containerWidth) {
                // (박스 폭 / 텍스트 폭) 비율을 계산해서 폰트 크기에 곱함
                let scaleFactor = containerWidth / textWidth;
                let newSize = 2.3 * scaleFactor;
                
                // 너무 작아지지 않도록 하한선(1.1vw) 설정
                if (newSize < 1.1) newSize = 1.1;
                
                text.style.fontSize = newSize + "vw";
            } else {
                // 공간이 충분하면 기본 크기인 2.3vw 유지
                text.style.fontSize = "2.3vw";
            }
        });
    }

    async function fetchAllNews() {
        const proxy = "https://api.rss2json.com/v1/api.json?rss_url=";
        for (const [key, url] of Object.entries(feeds)) {
            try {
                const response = await fetch(proxy + encodeURIComponent(url) + "&t=" + Date.now());
                const data = await response.json();
                if (data.status === 'ok') { newsData[key] = data.items.slice(0, 3); }
            } catch (e) { console.error(key + " 로딩 실패"); }
        }
        displayNews();
    }

    function displayNews() {
        Object.keys(newsData).forEach(key => {
            const items = newsData[key];
            if (items.length > currentRank) {
                const row = document.getElementById(`row-${key}`);
                const textEl = row.querySelector('.title-text');
                textEl.innerText = items[currentRank].title.split(' - ')[0];
                textEl.classList.remove('fade-in');
                void textEl.offsetWidth; 
                textEl.classList.add('fade-in');
            }
        });

        // 텍스트가 바뀐 직후 폰트 조절 실행
        setTimeout(adjustFontSize, 50);
        currentRank = (currentRank + 1) % 3;
    }

    fetchAllNews();
    setInterval(displayNews, 15000); // 15초 주기로 순환
    setInterval(fetchAllNews, 600000);

    function updateClock() {
        const now = new Date();
        document.getElementById('display-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        document.getElementById('display-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    async function updateWeather() {
        try {
            const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.4292&longitude=126.9899&current_weather=true&relative_humidity_2m=true');
            const data = await res.json();
            document.getElementById('w-temp').innerText = `${Math.round(data.current_weather.temperature)}°C`;
            document.getElementById('w-humi').innerText = data.current_weather.relative_humidity || 45;
            document.getElementById('w-wind').innerText = data.current_weather.windspeed;
        } catch (e) {}
    }

    updateClock(); setInterval(updateClock, 1000);
    updateWeather(); setInterval(updateWeather, 3600000);
    window.addEventListener('resize', adjustFontSize);
</script>
</body>
</html>
